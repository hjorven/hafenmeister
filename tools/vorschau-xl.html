<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorschau XL- und XXL-Schiffe</title>
<!--
  Werkzeug, nicht Teil des Spiels (wird nicht auf GitHub Pages veröffentlicht).
  Starten im Repo-Ordner:
    python3 -m http.server 8000
  Dann http://localhost:8000/tools/vorschau-xl.html öffnen.
  Parameter: ?size=xxl  ?palette=1  ?sails=1  ?model=XL2-3
-->
<style>
  html, body { margin: 0; height: 100%; background: #76c4cc; font: 14px system-ui, sans-serif; color: #24323f; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #bar button { font: inherit; padding: 6px 12px; border: 0; border-radius: 8px; background: #fff8ea; cursor: pointer; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="bar">
  <button id="pal">Farbe wechseln</button>
  <button id="sail">Segel setzen/bergen</button>
  <button id="turn">Drehen</button>
  <button id="move">Fahrt an/aus</button>
</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
const size = (new URLSearchParams(location.search).get('size') || 'xl').toLowerCase();
const { MODELS, buildBoat, setSails, animateBoat } = await import(`../web/js/render/boats/${size}.js`);

const q = new URLSearchParams(location.search);
let palette = Number(q.get('palette') || 0);
let sails = q.get('sails') === '1';
let moving = false;
const only = q.get('model');

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#76c4cc');
scene.add(new THREE.HemisphereLight('#ffffff', '#88aabb', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 1.5);
sun.position.set(-60, 120, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.05;
Object.assign(sun.shadow.camera, { left: -500, right: 500, top: 500, bottom: -500, far: 1200 });
scene.add(sun);
const water = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ color: '#76c4cc' }));
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;
scene.add(water);

const list = only ? MODELS.filter((m) => m.id === only) : MODELS;
const holder = new THREE.Group();
scene.add(holder);
const maxL = Math.max(...list.map((m) => m.length));
const COLS = only ? 1 : 3, DX = maxL * 1.15, DZ = Math.max(24, maxL * 0.4);
let boats = [];
let turn = 0;

function rebuild() {
  holder.clear();
  boats = list.map((m, i) => {
    const g = buildBoat(m, { palette, sails, id: m.id });
    const col = i % COLS, row = Math.floor(i / COLS);
    g.position.set((col - (COLS - 1) / 2) * DX, 0, (row - (Math.ceil(list.length / COLS) - 1) / 2) * DZ);
    g.rotation.y = turn;
    holder.add(g);
    return g;
  });
}
rebuild();

const camera = new THREE.OrthographicCamera();
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  const span = only ? 1.45 * maxL : Math.max(175, 3.4 * maxL);
  const a = w / h;
  const half = a > 1 ? span / 2 : span / 2 / a;
  Object.assign(camera, { left: -half * a, right: half * a, top: half, bottom: -half, near: -2000, far: 4000 });
  const k = maxL / 34;
  camera.position.set(80 * k, 90 * k, 110 * k);
  camera.lookAt(0, only ? 0.18 * maxL : 0, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

document.getElementById('pal').onclick = () => { palette = (palette + 1) % 3; rebuild(); };
document.getElementById('sail').onclick = () => { sails = !sails; boats.forEach((b) => setSails(b, sails)); };
document.getElementById('turn').onclick = () => { turn += Math.PI / 2; boats.forEach((b) => (b.rotation.y = turn)); };
document.getElementById('move').onclick = () => { moving = !moving; };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  boats.forEach((b) => animateBoat(b, t, { speed: moving ? 4 : 0 }));
  renderer.render(scene, camera);
});
window.ready = true;
</script>
</body>
</html>
