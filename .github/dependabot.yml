# Hält die auf Commit-SHAs gepinnten Actions aktuell: Dependabot schlägt einmal
# im Monat einen gesammelten Pull Request mit neuen SHAs (und Versionskommentar) vor.
# Nur Patch- und Minor-Versionen; ein Major-Sprung wird bewusst von Hand gemacht.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Actions"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
