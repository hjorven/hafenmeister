# Veröffentlicht den Ordner web/ auf GitHub Pages.
# Adresse: https://hjorven.github.io/hafenmeister/
# Voraussetzung: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
    # Nur wenn sich etwas an der Seite ändert, nicht bei reinen Doku- oder Skript-Änderungen.
    paths:
      - "web/**"
      - "docs/roadmap.md"
      - "docs/roadmap-bilder.json"
      - "tools/roadmap.mjs"
      - "tools/build-pages.sh"
      - "tools/check-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Grundsatz: Der Workflow selbst bekommt keine Rechte, jeder Job nur, was er braucht.
# Nur der Deploy-Job darf auf Pages schreiben (pages, id-token); der Build liest nur.
permissions: {}

# Bei vielen Merges kurz hintereinander zählt nur der neueste Stand:
# ältere wartende oder laufende Läufe werden abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Ganze Historie: die Roadmap-Seite zeigt die letzten Merges
          fetch-depth: 0

      - name: Seite zusammenstellen
        run: bash tools/build-pages.sh

      - name: Pfade prüfen
        run: bash tools/check-pages.sh _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
