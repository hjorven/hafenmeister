# Veröffentlicht den Ordner web/ auf GitHub Pages.
# Adresse: https://hjorven.github.io/hafenmeister/
# Voraussetzung: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
    # Nur wenn sich etwas an der Seite ändert, nicht bei reinen Doku- oder Skript-Änderungen.
    paths:
      - "web/**"
      - "docs/roadmap.md"
      - "docs/roadmap-bilder.json"
      - "tools/roadmap.mjs"
      - "tools/build-pages.sh"
      - "tools/check-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Bei vielen Merges kurz hintereinander zählt nur der neueste Stand:
# ältere wartende oder laufende Läufe werden abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Ganze Historie: die Roadmap-Seite zeigt die letzten Merges
          fetch-depth: 0

      - name: Seite zusammenstellen
        run: bash tools/build-pages.sh

      - name: Pfade prüfen
        run: bash tools/check-pages.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
