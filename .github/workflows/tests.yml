# Automatische Tests: startet das Spiel in Handy-, Tablet- und PC-Groesse (Playwright, Chromium)
# und prueft Laden, Grundbedienung und Layout. Bildschirmfotos gibt es als Download im Lauf.
# Anleitung: docs/tests.md
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow ohne Rechte, jeder Job liest nur den Code.
permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schnell:
    name: Pfade und Tests ohne Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Pfade wie für GitHub Pages prüfen
        run: bash tools/check-pages.sh web

      - name: Tests ohne Browser (node --test)
        run: |
          shopt -s nullglob
          dateien=(tests/*.test.mjs)
          if [ ${#dateien[@]} -gt 0 ]; then node --test "${dateien[@]}"; else echo "Keine tests/*.test.mjs vorhanden."; fi

  geraet:
    # Ein Job je Geraet, parallel. Zusammen sind es zu viele Tests fuer einen Job.
    name: Spiel testen (${{ matrix.projekt }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projekt: [handy, handy-quer, tablet, tablet-quer, pc]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Tests ausführen
        run: npx playwright test --project=${{ matrix.projekt }}

      - name: Bildschirmfotos hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bildschirmfotos-${{ matrix.projekt }}
          path: tests/bildschirmfotos/
          if-no-files-found: ignore
          retention-days: 14

      - name: Testbericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testbericht-${{ matrix.projekt }}
          path: |
            tests/bericht/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  spiel:
    # Sammel-Check mit dem bisherigen Namen, damit eine Branch-Regel nur diesen einen Check braucht
    name: Spiel testen (Handy, Tablet, PC)
    needs: [schnell, geraet]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ergebnis aller Geräte
        run: |
          echo "schnell: ${{ needs.schnell.result }}, Geräte: ${{ needs.geraet.result }}"
          test "${{ needs.schnell.result }}" = success
          test "${{ needs.geraet.result }}" = success
