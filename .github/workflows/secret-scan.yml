# Sucht in der ganzen Git-Historie nach versehentlich eingecheckten Schlüsseln,
# Tokens und Passwörtern (gitleaks). Läuft bei jedem Pull Request, auf main und
# einmal pro Woche. Fund: Lauf wird rot, die Stelle steht im Log (Wert geschwärzt).
# Falscher Alarm: Fingerprint aus dem Log in .gitleaksignore eintragen.
# Anleitung: docs/sicherheit.md
name: Secret-Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Feste Version mit geprüfter Prüfsumme (aus gitleaks_<version>_checksums.txt des Releases)
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Secrets suchen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks laden und Prüfsumme prüfen
        run: |
          datei="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$datei" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${datei}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$datei" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$datei" -C "$RUNNER_TEMP" gitleaks

      - name: Ganze Historie durchsuchen
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
